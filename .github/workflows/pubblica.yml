# Pubblicazione automatica del sito su SiteGround a ogni push su main (o da Actions → Pubblica → Run workflow).
# Segreti del repository (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_PORT (SiteGround: 18765), SSH_USER, SSH_KEY (chiave privata), SSH_PASSPHRASE (se la chiave ne ha una)
#   PATH_IT  = cartella pubblica di gesthallsuite.it  (es. www/gesthallsuite.it/public_html)
#   PATH_COM = cartella pubblica di gesthallsuite.com (facoltativo). Su SiteGround ogni sito ha il suo utente SSH:
#     se il .com è un sito a parte servono anche COM_SSH_HOST, COM_SSH_USER, COM_SSH_KEY, COM_SSH_PASSPHRASE (COM_SSH_PORT)
#   INTERNO_PASSWORD (facoltativo) = password dell'area interna; INTERNO_TOTP (facoltativo) = segreto dell'app
# Senza i segreti SSH il sito viene solo costruito (nessun errore).
name: Pubblica
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: pubblica
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chiavi SSH
        id: ssh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          COM_SSH_KEY: ${{ secrets.COM_SSH_KEY }}
          COM_SSH_PASSPHRASE: ${{ secrets.COM_SSH_PASSPHRASE }}
          COM_SSH_HOST: ${{ secrets.COM_SSH_HOST }}
          COM_SSH_PORT: ${{ secrets.COM_SSH_PORT }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then echo "Segreti SSH mancanti: niente pubblicazione."; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          chiave() {
            printf '%s\n' "$1" > ~/.ssh/$2 && chmod 600 ~/.ssh/$2
            if [ -n "$3" ]; then ssh-keygen -p -P "$3" -N "" -f ~/.ssh/$2 >/dev/null; fi
            ssh-keyscan -p "$5" "$4" >> ~/.ssh/known_hosts 2>/dev/null || true
          }
          chiave "$SSH_KEY" id "$SSH_PASSPHRASE" "$SSH_HOST" "${SSH_PORT:-18765}"
          if [ -n "$COM_SSH_KEY" ]; then chiave "$COM_SSH_KEY" id_com "$COM_SSH_PASSPHRASE" "${COM_SSH_HOST:-$SSH_HOST}" "${COM_SSH_PORT:-${SSH_PORT:-18765}}"; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: config.php dell'area interna
        if: steps.ssh.outputs.ok == '1'
        env:
          INTERNO_PASSWORD: ${{ secrets.INTERNO_PASSWORD }}
          INTERNO_TOTP: ${{ secrets.INTERNO_TOTP }}
        run: |
          if [ -n "$INTERNO_PASSWORD" ]; then
            php -r '$c = ["password_hash" => password_hash(getenv("INTERNO_PASSWORD"), PASSWORD_DEFAULT), "totp_segreto" => (string)getenv("INTERNO_TOTP")]; file_put_contents("php/interno/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");'
            echo "config.php creato dai segreti."
          fi
      - name: Invio a SiteGround
        if: steps.ssh.outputs.ok == '1'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          COM_SSH_HOST: ${{ secrets.COM_SSH_HOST }}
          COM_SSH_PORT: ${{ secrets.COM_SSH_PORT }}
          COM_SSH_USER: ${{ secrets.COM_SSH_USER }}
          COM_SSH_KEY: ${{ secrets.COM_SSH_KEY }}
          PATH_IT: ${{ secrets.PATH_IT }}
          PATH_COM: ${{ secrets.PATH_COM }}
        run: |
          # area interna: --delete toglie i vecchi /interno/*.html; config.php e dati/ restano sul server se non li crea la pubblicazione
          INT_EXCL="--exclude=dati/"; [ -f php/interno/config.php ] || INT_EXCL="$INT_EXCL --exclude=config.php"
          ERR=0
          pubblica() {  # nome, cartella, sorgente, utente@host, porta, chiave
            [ -n "$2" ] || { echo "$1: cartella non impostata, salto."; return 0; }
            E="ssh -i $HOME/.ssh/$6 -p $5 -o StrictHostKeyChecking=accept-new"
            if ! $E "$4" "test -d '$2'"; then
              echo "::error::$1: la cartella «$2» non esiste per l'utente SSH ${4%@*} (controlla il percorso o, se è un altro sito SiteGround, i segreti COM_SSH_*)."
              ERR=1; return 0
            fi
            rsync -rlz --checksum -e "$E" "$3"/ "$4:$2/" \
              && rsync -rlz --checksum --delete $INT_EXCL -e "$E" php/interno/ "$4:$2/interno/" \
              && echo "$1: pubblicato in $2" || { echo "::error::$1: copia non riuscita"; ERR=1; }
          }
          pubblica gesthallsuite.it "$PATH_IT" dist "$SSH_USER@$SSH_HOST" "${SSH_PORT:-18765}" id
          if [ -n "$COM_SSH_KEY" ]; then
            pubblica gesthallsuite.com "$PATH_COM" dist-com "${COM_SSH_USER:-$SSH_USER}@${COM_SSH_HOST:-$SSH_HOST}" "${COM_SSH_PORT:-${SSH_PORT:-18765}}" id_com
          else
            pubblica gesthallsuite.com "$PATH_COM" dist-com "$SSH_USER@$SSH_HOST" "${SSH_PORT:-18765}" id
          fi
          echo "Versione della suite nel changelog: $(node -e 'console.log(require("./src/data/changelog.json").releases[0].version)')"
          exit $ERR
